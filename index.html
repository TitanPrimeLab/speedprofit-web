    <!--
      Schema.org — Organization + LocalBusiness + Offer
      Esto es lo que un motor de IA (ChatGPT, Gemini, Perplexity...) o un
      buscador leen como datos verificables de la empresa, en vez de tener
      que interpretarlos del texto visual de la web. Mantener actualizado si
      cambia el precio, la dirección o los datos de contacto.

      ⚠️ IMPORTANTE — no rellenar "sameAs" ni "aggregateRating" con enlaces o
      cifras que no existan todavía (Google Business Profile, Trustpilot...).
      Un dato estructurado falso es peor que no ponerlo: si un motor de IA lo
      contrasta con la fuente real y no coincide, penaliza la confianza en
      toda la web. Añadir cada campo según se vaya creando de verdad — ver
      CLAUDE.md, "Frente 3".
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "SpeedProfit AI",
      "description": "Automatización con inteligencia artificial para agencias inmobiliarias independientes en España: agentes de IA que responden, cualifican y agendan visitas 24/7, y captación de exclusivas con Meta Ads.",

        "postalCode": "50794",
        "addressCountry": "ES"
      },
      "areaServed": {
        "@type": "Country",
        "name": "España"
      },
      "priceRange": "1500€",

        "@type": "Offer",
        "name": "Implementación de agente de IA para inmobiliarias",
        "price": "1500",

      }
    }
